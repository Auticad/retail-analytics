# Pubblica la demo statica del front-end React su GitHub Pages.
# Prerequisiti: Settings > Pages > Source = "GitHub Actions";
# istantanea dei dati in frontend/public/demo (npm run demo:snapshot, con il backend avviato).
name: Demo su GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione alla volta; quella in corso non viene interrotta
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Controllo istantanea dei dati
        run: |
          if [ ! -f public/demo/meta.json ]; then
            echo "::error::Manca frontend/public/demo. Esegui 'npm run demo:snapshot' con il backend avviato e salva i file su Git."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Build demo
        run: npm run build:demo
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
