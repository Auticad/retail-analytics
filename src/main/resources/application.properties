spring.application.name=retail-analytics

# 8080 resta libero per il Tomcat del corso Servlet
server.port=8081

# --- Datasource: ogni valore ha un default e si puo' sovrascrivere con una variabile d'ambiente
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3310}/${DB_NAME:retail_analytics}
spring.datasource.username=${DB_USER:retail}
spring.datasource.password=${DB_PASSWORD:retail}

# --- JPA: lo schema lo governa Flyway, Hibernate si limita a verificare che le entita' corrispondano
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Thymeleaf: con devtools la cache e' gia' disattivata in sviluppo

# --- Actuator: espone solo health e info
management.endpoints.web.exposure.include=health,info

# --- OpenAPI: documenta solo le API REST, non le pagine Thymeleaf
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
